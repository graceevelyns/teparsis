services:
  # Raft Node 1 (Leader candidate)
  raft-node1:
    build:
      context: ./src/server
      target: development
    container_name: raft-node1
    ports:
      - "3000:3000"
    environment:
      - NODE_ID=3000
      - NODE_PORT=3000
      - CLUSTER_PEERS=http://raft-node2:3000,http://raft-node3:3000,http://raft-node4:3000,http://raft-node5:3000,http://raft-node6:3000
      - CLUSTER_PEERS_IDS=3001,3002,3003,3004,3005
      - INITIAL_ACTIVE=true
    volumes:
      # Mount source code
      - ./src/server/src:/app/src
      - ./src/server/tsconfig.json:/app/tsconfig.json
      # Use named volume for node_modules to avoid conflicts
      - raft-node1-modules:/app/node_modules
    networks:
      - raft-network
    restart: unless-stopped

  # Raft Node 2
  raft-node2:
    build:
      context: ./src/server
      target: development
    container_name: raft-node2
    ports:
      - "3001:3000"
    environment:
      - NODE_ID=3001
      - NODE_PORT=3000
      - CLUSTER_PEERS=http://raft-node1:3000,http://raft-node3:3000,http://raft-node4:3000,http://raft-node5:3000,http://raft-node6:3000
      - CLUSTER_PEERS_IDS=3000,3002,3003,3004,3005
      - INITIAL_ACTIVE=true
    volumes:
      # Mount source code
      - ./src/server/src:/app/src
      - ./src/server/tsconfig.json:/app/tsconfig.json
      # Use named volume for node_modules to avoid conflicts
      - raft-node2-modules:/app/node_modules
    networks:
      - raft-network
    restart: unless-stopped

  # Raft Node 3
  raft-node3:
    build:
      context: ./src/server
      target: development
    container_name: raft-node3
    ports:
      - "3002:3000"
    environment:
      - NODE_ID=3002
      - NODE_PORT=3000
      - CLUSTER_PEERS=http://raft-node1:3000,http://raft-node2:3000,http://raft-node4:3000,http://raft-node5:3000,http://raft-node6:3000
      - CLUSTER_PEERS_IDS=3000,3001,3003,3004,3005
      - INITIAL_ACTIVE=true
    volumes:
      # Mount source code
      - ./src/server/src:/app/src
      - ./src/server/tsconfig.json:/app/tsconfig.json
      # Use named volume for node_modules to avoid conflicts
      - raft-node3-modules:/app/node_modules
    networks:
      - raft-network
    restart: unless-stopped

  # Raft Node 4
  raft-node4:
    build:
      context: ./src/server
      target: development
    container_name: raft-node4
    ports:
      - "3003:3000"
    environment:
      - NODE_ID=3003
      - NODE_PORT=3000
      - CLUSTER_PEERS=http://raft-node1:3000,http://raft-node2:3000,http://raft-node3:3000,http://raft-node5:3000,http://raft-node6:3000
      - CLUSTER_PEERS_IDS=3000,3001,3002,3004,3005
      - INITIAL_ACTIVE=true
    volumes:
      # Mount source code
      - ./src/server/src:/app/src
      - ./src/server/tsconfig.json:/app/tsconfig.json
      # Use named volume for node_modules to avoid conflicts
      - raft-node4-modules:/app/node_modules
    networks:
      - raft-network
    restart: unless-stopped

  # Raft Node 5
  raft-node5:
    build:
      context: ./src/server
      target: development
    container_name: raft-node5
    ports:
      - "3004:3000"
    environment:
      - NODE_ID=3004
      - NODE_PORT=3000
      - CLUSTER_PEERS=http://raft-node1:3000,http://raft-node2:3000,http://raft-node3:3000,http://raft-node4:3000,http://raft-node6:3000
      - CLUSTER_PEERS_IDS=3000,3001,3002,3003,3005
      - INITIAL_ACTIVE=true
    volumes:
      # Mount source code
      - ./src/server/src:/app/src
      - ./src/server/tsconfig.json:/app/tsconfig.json
      # Use named volume for node_modules to avoid conflicts
      - raft-node5-modules:/app/node_modules
    networks:
      - raft-network
    restart: unless-stopped

  # Raft Node 6
  raft-node6:
    build:
      context: ./src/server
      target: development
    container_name: raft-node6
    ports:
      - "3005:3000"
    environment:
      - NODE_ID=3005
      - NODE_PORT=3000
      - CLUSTER_PEERS=http://raft-node1:3000,http://raft-node2:3000,http://raft-node3:3000,http://raft-node4:3000,http://raft-node5:3000
      - CLUSTER_PEERS_IDS=3000,3001,3002,3003,3004
      - INITIAL_ACTIVE=false
    volumes:
      # Mount source code
      - ./src/server/src:/app/src
      - ./src/server/tsconfig.json:/app/tsconfig.json
      # Use named volume for node_modules to avoid conflicts
      - raft-node6-modules:/app/node_modules
    networks:
      - raft-network
    restart: unless-stopped

  # Web Client
  web-client:
    build:
      context: ./src/client
      target: development
    container_name: raft-web-client
    ports:
      - "8080:8080"
    environment:
      - NODE_1_URL=http://localhost:3000
      - NODE_2_URL=http://localhost:3001
      - NODE_3_URL=http://localhost:3002
      - NODE_4_URL=http://localhost:3003
      - NODE_5_URL=http://localhost:3004
      - NODE_6_URL=http://localhost:3005
    volumes:
      # Mount source code
      - ./src/client/src:/app/src
      - ./src/client/index.html:/app/index.html
      - ./src/client/tsconfig.json:/app/tsconfig.json
      # Mount dist for compiled output
      - ./src/client/dist:/app/dist
      # Use named volume for node_modules to avoid conflicts
      - web-client-modules:/app/node_modules
    networks:
      - raft-network
    depends_on:
      - raft-node1
      - raft-node2
      - raft-node3
      - raft-node4
      - raft-node5
      - raft-node6
    restart: unless-stopped

networks:
  raft-network:
    driver: bridge

volumes:
  raft-node1-modules:
  raft-node2-modules:
  raft-node3-modules:
  raft-node4-modules:
  raft-node5-modules:
  raft-node6-modules:
  web-client-modules:
