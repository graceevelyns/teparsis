    restart: unless-stopped

  # Web Client
  web-client:
    build:
      context: ./src/client
      target: development
    container_name: raft-web-client
    ports:
      - "8080:8080"
    environment:
      - NODE_1_URL=http://localhost:3000
      - NODE_2_URL=http://localhost:3001
      - NODE_3_URL=http://localhost:3002
      - NODE_4_URL=http://localhost:3003
      - NODE_5_URL=http://localhost:3004
      - NODE_6_URL=http://localhost:3005
    volumes:
      # Mount source code
      - ./src/client/src:/app/src
      - ./src/client/index.html:/app/index.html
      - ./src/client/tsconfig.json:/app/tsconfig.json
      # Mount dist for compiled output
      - ./src/client/dist:/app/dist
      # Use named volume for node_modules to avoid conflicts
      - web-client-modules:/app/node_modules
    networks:
      - raft-network
    depends_on:
      - raft-node3000
      - raft-node3001
      - raft-node3002
      - raft-node3003
      - raft-node3004
      - raft-node3005
    restart: unless-stopped

networks:
  raft-network:
    driver: bridge

volumes:
  raft-node3000-modules:
  raft-node3001-modules:
  raft-node3002-modules:
  raft-node3003-modules:
  raft-node3004-modules:
  raft-node3005-modules:
  web-client-modules:
