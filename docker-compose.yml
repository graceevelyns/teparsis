services:
  # Raft Node 1 (Leader candidate)
  raft-node3000:
    build:
      context: ./src/server
      target: development
    container_name: raft-node3000
    ports:
      - "3000:3000"
    environment:
      - NODE_ID=3000
      - NODE_PORT=3000
      - NODE_HOST=raft-node3000
      - CLUSTER_PEERS=http://raft-node3001:3000,http://raft-node3002:3000,http://raft-node3003:3000,http://raft-node3004:3000,http://raft-node3005:3000
      - CLUSTER_PEERS_IDS=3001,3002,3003,3004,3005
      - INITIAL_ACTIVE=true
    volumes:
      # Mount source code
      - ./src/server/src:/app/src
      - ./src/server/tsconfig.json:/app/tsconfig.json
      # Use named volume for node_modules to avoid conflicts
      - raft-node3000-modules:/app/node_modules
    networks:
      - raft-network
    restart: unless-stopped

  # Raft Node 2
  raft-node3001:
    build:
      context: ./src/server
      target: development
    container_name: raft-node3001
