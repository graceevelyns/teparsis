      - NODE_HOST=raft-node3001
      - CLUSTER_PEERS=http://raft-node3000:3000,http://raft-node3002:3000,http://raft-node3003:3000,http://raft-node3004:3000,http://raft-node3005:3000
      - CLUSTER_PEERS_IDS=3000,3002,3003,3004,3005
      - INITIAL_ACTIVE=true
    volumes:
      # Mount source code
      - ./src/server/src:/app/src
      - ./src/server/tsconfig.json:/app/tsconfig.json
      # Use named volume for node_modules to avoid conflicts
      - raft-node3001-modules:/app/node_modules
